<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp Mesajlaşma</title>
  <style>
    /* UstadDesignTokens parity */
    :root {
      --color-whatsapp-primary: #25d366;
      --color-whatsapp-secondary: #128c7e;
      --color-whatsapp-light: #dcf8c6;
      --color-whatsapp-background: #ece5dd;
      --color-primary-green: #295c00;
      --color-primary-orange: #ff9914;
      --color-background-primary: #ffffff;
      --color-background-secondary: #fcfcff;
      --color-background-light: #ffffff;
      --color-text-primary: #000000;
      --color-text-secondary: #374151;
      --color-text-tertiary: #6b7280;
      --color-text-muted: #9ca3af;
      --color-border-primary: rgba(0,0,0,0.08);
      --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
      --spacing-xs: 8px;
      --spacing-sm: 12px;
      --spacing-md: 16px;
      --spacing-lg: 20px;
      --font-family-base: 'Inter Tight', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-size-xs: 12px;
      --font-size-sm: 14px;
      --font-size-base: 16px;
      --font-size-lg: 18px;
      --border-radius: 16px;
      --border-radius-sm: 12px;
      --border-radius-md: 6px;
      --border-radius-lg: 32px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-family-base);
      color: var(--color-text-primary);
      background: var(--color-background-secondary);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* Top bar */
    .top-bar {
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      padding: var(--spacing-sm) var(--spacing-lg);
      background: var(--color-background-primary);
      border-bottom: 2px solid var(--color-border-primary);
      box-shadow: var(--shadow-sm);
      flex-shrink: 0;
    }
    .top-bar label { font-size: var(--font-size-sm); color: var(--color-text-secondary); }
    .top-bar select {
      padding: 6px 12px;
      border: 2px solid var(--color-border-primary);
      border-radius: var(--border-radius-md);
      font-size: var(--font-size-sm);
      min-width: 220px;
    }
    .top-bar select:focus {
      outline: none;
      border-color: var(--color-whatsapp-primary);
      box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.1);
    }
    .btn-refresh, .btn-new-chat {
      padding: 8px 16px;
      border: none;
      border-radius: var(--border-radius-md);
      font-size: var(--font-size-sm);
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-refresh {
      background: var(--color-background-secondary);
      color: var(--color-text-secondary);
      border: 1px solid var(--color-border-primary);
    }
    .btn-refresh:hover { background: var(--color-whatsapp-background); }
    .btn-new-chat {
      background: linear-gradient(135deg, var(--color-whatsapp-primary) 0%, var(--color-whatsapp-secondary) 100%);
      color: var(--color-background-light);
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
    }
    .btn-new-chat:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(37, 211, 102, 0.4);
    }
    .session-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .session-dot.connected { background: var(--color-whatsapp-primary); }
    .session-dot.disconnected { background: #f44336; }
    .session-dot.needs_qr { background: var(--color-primary-orange); }
    .session-dot.connecting { background: #ffeb3b; }
    .session-dot.initializing { background: var(--color-primary-orange); animation: pulse 2s infinite; }
    @keyframes pulse {
      from, to { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .top-bar .spacer { flex: 1; }
    .btn-pulse {
      padding: 6px 10px;
      border: 1px solid var(--color-border-primary);
      border-radius: var(--border-radius-md);
      background: var(--color-background-secondary);
      font-size: var(--font-size-xs);
      color: var(--color-text-tertiary);
      cursor: pointer;
    }
    .btn-pulse:hover { background: var(--color-whatsapp-background); color: var(--color-text-secondary); }
    .pulse-panel {
      display: none;
      padding: var(--spacing-sm) var(--spacing-lg);
      background: #f8f9fa;
      border-bottom: 1px solid var(--color-border-primary);
      font-size: var(--font-size-xs);
      color: var(--color-text-secondary);
      flex-shrink: 0;
    }
    .pulse-panel.visible { display: block; }
    .pulse-panel .pulse-row { margin-bottom: 4px; }
    .pulse-panel .pulse-sync.stale { color: #c62828; font-weight: 600; }
    /* Main layout */
    .main-layout {
      display: flex;
      flex: 1;
      min-height: 0;
    }
    /* Sidebar - UstadInboxList */
    .sidebar {
      width: 360px;
      min-width: 280px;
      background: var(--color-background-primary);
      border-right: 1px solid var(--color-border-primary);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-search {
      padding: var(--spacing-md);
      border-bottom: 1px solid var(--color-border-primary);
    }
    .sidebar-search input {
      width: 100%;
      padding: var(--spacing-sm) var(--spacing-md);
      border: 2px solid var(--color-border-primary);
      border-radius: var(--border-radius-md);
      font-size: var(--font-size-sm);
    }
    .sidebar-search input:focus {
      outline: none;
      border-color: var(--color-whatsapp-primary);
      box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.1);
    }
    .filter-unread {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      padding: var(--spacing-xs) var(--spacing-md);
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
    }
    .filter-unread input { cursor: pointer; }
    .conversation-list {
      flex: 1;
      overflow-y: auto;
      padding: 0;
    }
    /* UstadConversationCard */
    .conversation-card {
      padding: var(--spacing-lg);
      border-bottom: 1px solid var(--color-border-primary);
      border-radius: var(--border-radius-md);
      box-shadow: var(--shadow-sm);
      background: var(--color-background-primary);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
    }
    .conversation-card:hover {
      background: var(--color-background-secondary);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }
    .conversation-card.selected {
      border-left: 4px solid var(--color-whatsapp-primary);
      background: var(--color-background-secondary);
    }
    .conversation-card .card-body { flex: 1; min-width: 0; }
    .conversation-card .card-title {
      font-weight: 600;
      font-size: var(--font-size-base);
      color: var(--color-text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .conversation-card .card-preview {
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .conversation-card .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }
    .conversation-card .card-time {
      font-size: var(--font-size-xs);
      color: var(--color-text-muted);
    }
    .unread-badge {
      background: var(--color-whatsapp-primary);
      color: var(--color-background-light);
      font-size: var(--font-size-xs);
      font-weight: bold;
      border-radius: 9999px;
      padding: 4px 10px;
      min-width: 24px;
      text-align: center;
      box-shadow: 0 2px 4px rgba(37, 211, 102, 0.3);
    }
    .card-arrow {
      font-size: 20px;
      color: var(--color-text-tertiary);
      transition: color 0.2s, transform 0.2s;
    }
    .conversation-card:hover .card-arrow {
      color: var(--color-whatsapp-primary);
      transform: translateX(4px);
    }
    /* Thread - UstadMessageThread */
    .thread-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: calc(100vh - 120px);
      background: linear-gradient(180deg, var(--color-background-primary) 0%, var(--color-whatsapp-background) 100%);
      border-radius: var(--border-radius-lg);
      border: 1px solid var(--color-border-primary);
      box-shadow: var(--shadow-lg);
      margin: var(--spacing-md);
    }
    .thread-header {
      padding: var(--spacing-lg);
      border-bottom: 2px solid var(--color-border-primary);
      background: linear-gradient(135deg, var(--color-whatsapp-primary) 0%, var(--color-whatsapp-secondary) 100%);
      box-shadow: var(--shadow-sm);
      flex-shrink: 0;
    }
    .thread-header .thread-title {
      font-weight: 600;
      font-size: var(--font-size-lg);
      color: var(--color-text-primary);
    }
    .thread-header .thread-phone,
    .thread-header .thread-meta {
      font-size: var(--font-size-sm);
      color: rgba(0,0,0,0.8);
      margin-top: 2px;
    }
    .thread-placeholder {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-tertiary);
      font-size: var(--font-size-base);
    }
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: var(--spacing-md);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-md);
    }
    /* UstadMessageBubble */
    .message-row {
      display: flex;
      justify-content: flex-start;
    }
    .message-row.outgoing, .message-row.outgoing_ai {
      justify-content: flex-end;
    }
    .message-bubble {
      max-width: 70%;
      padding: var(--spacing-sm) var(--spacing-md);
      border-radius: var(--border-radius);
      font-size: var(--font-size-sm);
      word-wrap: break-word;
    }
    .message-bubble.incoming {
      background: var(--color-background-secondary);
      color: var(--color-text-primary);
      border: 1px solid var(--color-border-primary);
    }
    .message-bubble.outgoing, .message-bubble.outgoing_ai {
      background: var(--color-primary-green);
      color: var(--color-background-light);
    }
    .message-bubble .bubble-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      margin-top: 4px;
    }
    .message-bubble.incoming .bubble-footer { color: var(--color-text-muted); }
    .message-bubble.outgoing .bubble-footer, .message-bubble.outgoing_ai .bubble-footer { color: rgba(255,255,255,0.8); }
    .message-bubble .status-read { color: #4fc3f7; }
    .message-bubble .status-delivered, .message-bubble .status-sent { color: #9e9e9e; }
    .message-bubble .status-failed { color: #f44336; }
    .message-bubble .ai-label {
      font-size: var(--font-size-xs);
      opacity: 0.9;
      margin-bottom: 2px;
    }
    .input-area {
      padding: var(--spacing-lg);
      border-top: 2px solid var(--color-border-primary);
      background: var(--color-background-primary);
      box-shadow: 0 -2px 8px rgba(0,0,0,0.05);
      flex-shrink: 0;
    }
    .input-row {
      display: flex;
      gap: var(--spacing-sm);
      align-items: flex-end;
    }
    .input-row textarea {
      flex: 1;
      padding: var(--spacing-sm) var(--spacing-md);
      border: 2px solid var(--color-border-primary);
      border-radius: var(--border-radius-lg);
      font-family: inherit;
      font-size: var(--font-size-sm);
      resize: none;
      min-height: 44px;
      max-height: 120px;
    }
    .input-row textarea:focus {
      outline: none;
      border-color: var(--color-whatsapp-primary);
      box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.1);
    }
    .btn-send {
      padding: 12px 24px;
      border: none;
      border-radius: var(--border-radius-md);
      font-weight: 600;
      font-size: var(--font-size-sm);
      cursor: pointer;
      background: linear-gradient(135deg, var(--color-whatsapp-primary) 0%, var(--color-whatsapp-secondary) 100%);
      color: var(--color-background-light);
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-send:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(37, 211, 102, 0.4);
    }
    .btn-send:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    /* Status bar */
    .status-bar {
      display: flex;
      align-items: center;
      gap: var(--spacing-lg);
      padding: var(--spacing-xs) var(--spacing-lg);
      background: #f0f0f0;
      border-top: 1px solid var(--color-border-primary);
      font-size: var(--font-size-xs);
      color: var(--color-text-tertiary);
      flex-shrink: 0;
    }
    .status-bar .status-session { font-weight: 600; }
    .status-bar .status-unread { color: var(--color-whatsapp-primary); font-weight: 600; }
    /* Compose modal - UstadComposeModal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-overlay.visible { display: flex; }
    .modal-content {
      background: var(--color-background-primary);
      border-radius: var(--border-radius-lg);
      padding: var(--spacing-lg);
      max-width: 440px;
      width: 90%;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-lg);
    }
    .modal-content h3 { font-size: var(--font-size-lg); color: var(--color-text-primary); margin-bottom: 4px; }
    .modal-error {
      background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
      border: 1px solid #fca5a5;
      color: #991b1b;
      padding: var(--spacing-sm);
      border-radius: var(--border-radius-sm);
      font-size: var(--font-size-sm);
      display: none;
    }
    .modal-error.visible { display: block; }
    .modal-content label {
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
      display: block;
      margin-bottom: 4px;
    }
    .modal-content input[type="tel"],
    .modal-content textarea {
      width: 100%;
      padding: var(--spacing-sm) var(--spacing-md);
      border: 2px solid #e5e7eb;
      border-radius: var(--border-radius-sm);
      font-family: inherit;
      font-size: var(--font-size-sm);
    }
    .modal-content input:focus,
    .modal-content textarea:focus {
      outline: none;
      border-color: var(--color-whatsapp-primary);
      box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.1);
    }
    .modal-content textarea { min-height: 80px; resize: vertical; }
    .modal-ai-row {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      padding: var(--spacing-sm);
      background: var(--color-background-secondary);
      border-radius: var(--border-radius-sm);
    }
    .modal-ai-row input { width: auto; }
    .modal-actions {
      display: flex;
      gap: var(--spacing-sm);
      justify-content: flex-end;
    }
    .modal-actions .btn-cancel {
      padding: 10px 20px;
      border: 1px solid var(--color-border-primary);
      border-radius: var(--border-radius-md);
      background: var(--color-background-secondary);
      color: var(--color-text-secondary);
      cursor: pointer;
      font-size: var(--font-size-sm);
    }
    .modal-actions .btn-send-modal {
      padding: 10px 20px;
      border: none;
      border-radius: var(--border-radius-md);
      background: linear-gradient(135deg, var(--color-whatsapp-primary) 0%, var(--color-whatsapp-secondary) 100%);
      color: var(--color-background-light);
      cursor: pointer;
      font-size: var(--font-size-sm);
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
    }
    .modal-actions .btn-send-modal:hover { transform: translateY(-2px); }
    /* Loading / empty / error states */
    .state-loading, .state-empty, .state-error {
      padding: var(--spacing-lg);
      text-align: center;
      color: var(--color-text-tertiary);
      font-size: var(--font-size-sm);
    }
    .state-error { color: #991b1b; }
    .toast {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      padding: var(--spacing-md) var(--spacing-lg);
      background: #1f2937;
      color: #fff;
      border-radius: var(--border-radius-md);
      font-size: var(--font-size-sm);
      box-shadow: var(--shadow-lg);
      opacity: 0;
      transition: transform 0.3s, opacity 0.3s;
      z-index: 1001;
    }
    .toast.visible {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    .toast.error { background: #991b1b; }
  </style>
</head>
<body>
  <div class="top-bar">
    <label for="envSelect">API Ortamı:</label>
    <select id="envSelect">
      <option value="dev">Development (localhost:8080)</option>
      <option value="prod">Production (143.198.228.153:8080)</option>
    </select>
    <button type="button" class="btn-refresh" id="btnRefresh">Yenile</button>
    <div class="spacer"></div>
    <span id="sessionDot" class="session-dot disconnected" title="Session"></span>
    <span id="sessionLabel" class="session-label">—</span>
    <button type="button" class="btn-pulse" id="btnPulse">Pulse</button>
    <button type="button" class="btn-new-chat" id="btnNewChat">Yeni Sohbet</button>
  </div>

  <div id="system-health">
    <div class="pulse-panel" id="pulsePanel">
      <div class="pulse-row"><strong>Latency (ms):</strong> <span id="pulseLatency">—</span> (Son yenileme)</div>
      <div class="pulse-row"><strong>Backend IP:</strong> <span id="pulseBackend">—</span></div>
      <div class="pulse-row"><strong>Sync Heartbeat:</strong> <span id="pulseSync" class="pulse-sync">Last Sync: —</span></div>
    </div>
  </div>

  <div class="main-layout">
    <aside class="sidebar">
      <div class="sidebar-search">
        <input type="text" id="searchInput" placeholder="Ara..." />
      </div>
      <label class="filter-unread">
        <input type="checkbox" id="filterUnread" /> Sadece Okunmamış
      </label>
      <div class="conversation-list" id="conversationList">
        <div class="state-empty" id="inboxEmpty">Konuşma seçin veya yeni sohbet başlatın.</div>
        <div class="state-loading" id="inboxLoading" style="display:none;">Yükleniyor...</div>
        <div class="state-error" id="inboxError" style="display:none;"></div>
      </div>
    </aside>

    <section class="thread-pane">
      <div class="thread-header" id="threadHeader" style="display:none;">
        <div class="thread-title" id="threadTitle">💬 Konuşma</div>
        <div class="thread-meta" id="threadMeta"></div>
      </div>
      <div class="thread-placeholder" id="threadPlaceholder">Konuşma seçin</div>
      <div class="messages-area" id="messagesArea" style="display:none;"></div>
      <div class="input-area" id="inputArea" style="display:none;">
        <div class="input-row">
          <textarea id="messageInput" placeholder="Mesaj yazın..." rows="2"></textarea>
          <button type="button" class="btn-send" id="btnSend">Gönder</button>
        </div>
      </div>
    </section>
  </div>

  <div class="status-bar">
    <span class="status-session" id="statusSession">Durum: —</span>
    <span class="status-unread" id="statusUnread">Okunmamış: 0</span>
    <span id="statusSync">Son güncelleme: —</span>
  </div>

  <div class="modal-overlay" id="composeModal">
    <div class="modal-content">
      <h3>Yeni Sohbet</h3>
      <div class="modal-error" id="composeError"></div>
      <label for="composePhone">Telefon (E.164, örn. +905xxxxxxxxx)</label>
      <input type="tel" id="composePhone" placeholder="+905xxxxxxxxx" />
      <label for="composeMessage">Mesaj</label>
      <textarea id="composeMessage" placeholder="Mesajınızı yazın..."></textarea>
      <label class="modal-ai-row">
        <input type="checkbox" id="composeIsAI" /> AI tarafından oluşturulacak
      </label>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="composeCancel">İptal</button>
        <button type="button" class="btn-send-modal" id="composeSend">Gönder</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
(function() {
  const statusLabels = {
    justNow: 'Şimdi',
    minutesAgo: 'dakika önce',
    hoursAgo: 'saat önce',
    daysAgo: 'gün önce'
  };

  function post(payload) {
    if (typeof window.chrome !== 'undefined' && window.chrome.webview && window.chrome.webview.postMessage) {
      window.chrome.webview.postMessage(JSON.stringify(payload));
    }
  }

  function formatPhoneDisplay(phone) {
    if (!phone || typeof phone !== 'string') return '';
    const digits = phone.replace(/\D/g, '');
    if (digits.length >= 12 && digits.startsWith('90')) {
      const rest = digits.slice(2);
      if (rest.length >= 10) {
        return '+90 (' + rest.slice(0, 3) + ') ' + rest.slice(3, 6) + ' ' + rest.slice(6, 8) + ' ' + rest.slice(8, 10);
      }
    }
    return phone;
  }

  function formatRelativeTime(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    const now = new Date();
    const diffMs = now - d;
    const diffMins = Math.floor(diffMs / 60000);
    const diffHours = Math.floor(diffMs / 3600000);
    const diffDays = Math.floor(diffMs / 86400000);
    if (diffMins < 1) return statusLabels.justNow;
    if (diffMins < 60) return diffMins + ' ' + statusLabels.minutesAgo;
    if (diffHours < 24) return diffHours + ' ' + statusLabels.hoursAgo;
    if (diffDays < 7) return diffDays + ' ' + statusLabels.daysAgo;
    return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: d.getFullYear() !== now.getFullYear() ? 'numeric' : undefined });
  }

  function formatMessageTime(dateStr) {
    if (!dateStr) return '';
    return new Date(dateStr).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  }

  function statusClass(status) {
    if (!status) return '';
    const s = (status + '').toLowerCase();
    if (s === 'read') return 'status-read';
    if (s === 'delivered' || s === 'sent') return 'status-delivered';
    if (s === 'failed') return 'status-failed';
    return '';
  }

  let state = {
    conversations: [],
    selectedConversationId: null,
    thread: null,
    search: '',
    filterUnread: false,
    sessionStatus: '',
    unreadCount: 0,
    lastSync: null,
    pulseLatencyMs: null,
    pulseBackendUrl: ''
  };
  const PULSE_STALE_SEC = 15;

  const conversationListEl = document.getElementById('conversationList');
  const inboxEmptyEl = document.getElementById('inboxEmpty');
  const inboxLoadingEl = document.getElementById('inboxLoading');
  const inboxErrorEl = document.getElementById('inboxError');
  const threadHeaderEl = document.getElementById('threadHeader');
  const threadPlaceholderEl = document.getElementById('threadPlaceholder');
  const messagesAreaEl = document.getElementById('messagesArea');
  const inputAreaEl = document.getElementById('inputArea');
  const messageInputEl = document.getElementById('messageInput');
  const threadTitleEl = document.getElementById('threadTitle');
  const threadMetaEl = document.getElementById('threadMeta');

  function renderConversationList() {
    const cards = conversationListEl.querySelectorAll('.conversation-card');
    cards.forEach(c => c.remove());
    inboxEmptyEl.style.display = 'none';
    inboxErrorEl.style.display = 'none';

    const convos = state.conversations || [];
    if (convos.length === 0) {
      inboxEmptyEl.textContent = 'Henüz konuşma yok.';
      inboxEmptyEl.style.display = 'block';
      return;
    }

    convos.forEach(function(c) {
      const card = document.createElement('div');
      card.className = 'conversation-card' + (c.conversationId === state.selectedConversationId ? ' selected' : '');
      card.dataset.conversationId = c.conversationId || c.userPhone || '';
      card.dataset.userPhone = c.userPhone || '';
      const title = (c.userName || c.userPhone || 'Numara').trim();
      const preview = (c.lastMessage || '').trim();
      const time = formatRelativeTime(c.lastMessageAt);
      const unread = (c.unreadCount || 0) > 0 ? '<span class="unread-badge">' + c.unreadCount + '</span>' : '';
      card.innerHTML =
        '<div class="card-body">' +
          '<div class="card-title">' + escapeHtml(title) + '</div>' +
          (preview ? '<div class="card-preview">' + escapeHtml(preview) + '</div>' : '') +
          '<div class="card-meta">' +
            '<span class="card-time">' + escapeHtml(time) + '</span>' +
            unread +
          '</div>' +
        '</div>' +
        '<span class="card-arrow">›</span>';
      card.addEventListener('click', function() {
        post({ action: 'selectConversation', conversationId: card.dataset.conversationId });
      });
      conversationListEl.appendChild(card);
    });
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text == null ? '' : text;
    return div.innerHTML;
  }

  function renderThread() {
    const data = state.thread;
    if (!data || !data.conversationId) {
      threadHeaderEl.style.display = 'none';
      messagesAreaEl.style.display = 'none';
      inputAreaEl.style.display = 'none';
      threadPlaceholderEl.style.display = 'block';
      threadPlaceholderEl.textContent = 'Konuşma seçin';
      return;
    }

    threadPlaceholderEl.style.display = 'none';
    threadHeaderEl.style.display = 'block';
    // Title: name or normalized phone only (never show raw conversationId)
    const displayName = (data.userName && data.userName.trim()) ? data.userName.trim() : (data.userPhone ? formatPhoneDisplay(data.userPhone) : 'Konuşma');
    threadTitleEl.textContent = '💬 ' + displayName;
    // Meta line: normalized phone (if we showed name), last message time, WhatsApp status
    const phoneDisplay = data.userPhone ? formatPhoneDisplay(data.userPhone) : '';
    const lastMsgText = data.lastMessageAt ? ('Son mesaj: ' + formatRelativeTime(data.lastMessageAt)) : '';
    const onWaText = data.onWhatsApp ? 'WhatsApp\'ta' : '';
    const metaParts = [phoneDisplay, lastMsgText, onWaText].filter(Boolean);
    threadMetaEl.textContent = metaParts.join(' · ');
    threadMetaEl.style.display = metaParts.length ? 'block' : 'none';
    messagesAreaEl.style.display = 'flex';
    inputAreaEl.style.display = 'block';

    const messages = (data.messages || []).slice().sort(function(a, b) {
      return new Date(a.createdAt) - new Date(b.createdAt);
    });

    messagesAreaEl.innerHTML = '';
    if (messages.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'state-empty';
      empty.textContent = 'Henüz mesaj yok. Sohbeti başlatın!';
      messagesAreaEl.appendChild(empty);
    } else {
      messages.forEach(function(m) {
        const row = document.createElement('div');
        const dir = m.direction || 'incoming';
        row.className = 'message-row ' + (dir === 'outgoing_ai' ? 'outgoing_ai' : dir);
        const bubble = document.createElement('div');
        bubble.className = 'message-bubble ' + (dir === 'outgoing_ai' ? 'outgoing_ai' : dir);
        let body = '';
        if ((m.isAI || dir === 'outgoing_ai') && (dir !== 'incoming')) {
          body += '<div class="ai-label">AI Generated</div>';
        }
        body += escapeHtml(m.message || '');
        const time = formatMessageTime(m.createdAt);
        const status = (m.status || '').toLowerCase();
        const statusCls = statusClass(m.status);
        body += '<div class="bubble-footer">' +
          '<span>' + time + '</span>' +
          (status ? '<span class="' + statusCls + '">' + escapeHtml(m.status) + '</span>' : '') +
        '</div>';
        bubble.innerHTML = body;
        row.appendChild(bubble);
        messagesAreaEl.appendChild(row);
      });
      messagesAreaEl.scrollTop = messagesAreaEl.scrollHeight;
    }
  }

  function showToast(message, isError) {
    const t = document.getElementById('toast');
    t.textContent = message;
    t.className = 'toast visible' + (isError ? ' error' : '');
    setTimeout(function() {
      t.className = 'toast';
    }, 4000);
  }

  function updateStatusBar(sessionStatus, unreadCount, lastSync) {
    state.sessionStatus = sessionStatus || '';
    state.unreadCount = unreadCount != null ? unreadCount : state.unreadCount;
    state.lastSync = lastSync != null ? lastSync : state.lastSync;

    document.getElementById('statusSession').textContent = 'Durum: ' + (sessionStatus || '—');
    document.getElementById('statusUnread').textContent = 'Okunmamış: ' + (state.unreadCount || 0);
    let syncText = 'Son güncelleme: —';
    if (state.lastSync) {
      const sec = Math.floor((Date.now() - new Date(state.lastSync).getTime()) / 1000);
      syncText = 'Son güncelleme: ' + sec + ' saniye önce';
    }
    document.getElementById('statusSync').textContent = syncText;

    const dot = document.getElementById('sessionDot');
    const s = (sessionStatus || '').toUpperCase();
    dot.className = 'session-dot ';
    if (s === 'CONNECTED') dot.classList.add('connected');
    else if (s === 'NEEDS_QR') dot.classList.add('needs_qr');
    else if (s === 'INITIALIZING') dot.classList.add('initializing');
    else if (s === 'CONNECTING') dot.classList.add('connecting');
    else dot.classList.add('disconnected');
    var displayLabel = sessionStatus || '—';
    if (s === 'INITIALIZING') displayLabel = 'Initializing...';
    document.getElementById('sessionLabel').textContent = displayLabel;
  }

  function updatePulsePanel(latencyMs, lastSyncIso, backendUrl) {
    if (latencyMs != null) {
      state.pulseLatencyMs = latencyMs;
      document.getElementById('pulseLatency').textContent = latencyMs;
    }
    if (backendUrl != null) {
      state.pulseBackendUrl = backendUrl;
      document.getElementById('pulseBackend').textContent = backendUrl || '—';
    }
    var syncEl = document.getElementById('pulseSync');
    if (lastSyncIso) {
      state.lastSync = lastSyncIso;
      var syncDate = new Date(lastSyncIso);
      var secAgo = Math.floor((Date.now() - syncDate.getTime()) / 1000);
      syncEl.textContent = 'Last Sync: ' + secAgo + ' s ago';
      syncEl.classList.toggle('stale', secAgo > PULSE_STALE_SEC);
    } else {
      syncEl.textContent = 'Last Sync: —';
      syncEl.classList.remove('stale');
    }
  }

  window.__ustadUpdateInbox = function(payload) {
    if (!payload) return;
    state.conversations = payload.conversations || [];
    state.selectedConversationId = state.selectedConversationId || null;
    inboxLoadingEl.style.display = 'none';
    if (payload.message && payload.message !== '') {
      inboxErrorEl.textContent = payload.message;
      inboxErrorEl.style.display = 'block';
    }
    renderConversationList();
  };

  window.__ustadUpdateThread = function(payload) {
    if (!payload) return;
    state.thread = payload;
    state.selectedConversationId = payload.conversationId || state.selectedConversationId;
    renderConversationList();
    renderThread();
  };

  window.__ustadUpdateStatus = function(sessionStatus, unreadCount, lastSync) {
    updateStatusBar(sessionStatus, unreadCount, lastSync);
  };

  window.__ustadUpdatePulse = function(latencyMs, lastSyncIso, backendUrl) {
    updatePulsePanel(latencyMs, lastSyncIso, backendUrl);
  };

  window.__ustadShowError = function(message) {
    showToast(message || 'Bir hata oluştu.', true);
  };

  window.__ustadOpenCompose = function(initialPhone, initialMessage) {
    document.getElementById('composePhone').value = initialPhone || '';
    document.getElementById('composeMessage').value = initialMessage || '';
    document.getElementById('composeError').classList.remove('visible');
    document.getElementById('composeModal').classList.add('visible');
  };

  document.getElementById('btnRefresh').addEventListener('click', function() {
    post({ action: 'refresh' });
  });

  document.getElementById('btnPulse').addEventListener('click', function() {
    var panel = document.getElementById('pulsePanel');
    panel.classList.toggle('visible');
  });

  document.getElementById('btnNewChat').addEventListener('click', function() {
    post({ action: 'newChat' });
    window.__ustadOpenCompose && window.__ustadOpenCompose('', '');
  });

  document.getElementById('searchInput').addEventListener('input', function() {
    const v = this.value.trim();
    if (state.search === v) return;
    state.search = v;
    post({ action: 'search', search: v });
  });

  document.getElementById('filterUnread').addEventListener('change', function() {
    state.filterUnread = this.checked;
    post({ action: 'filterUnread', filterUnread: this.checked });
  });

  document.getElementById('envSelect').addEventListener('change', function() {
    post({ action: 'changeEnvironment', env: this.value });
  });

  document.getElementById('btnSend').addEventListener('click', function() {
    const phone = state.thread && state.thread.userPhone;
    const text = messageInputEl.value.trim();
    if (!phone || !text) return;
    post({ action: 'send', userPhone: phone, message: text, isAI: false });
    messageInputEl.value = '';
  });

  messageInputEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      document.getElementById('btnSend').click();
    }
  });

  document.getElementById('composeCancel').addEventListener('click', function() {
    document.getElementById('composeModal').classList.remove('visible');
  });

  function formatPhoneInput(value) {
    var digits = (value || '').replace(/\D/g, '');
    if (digits.length === 0) return '';
    if (digits.startsWith('90') && digits.length >= 12) {
      return '+' + digits.slice(0, 2) + ' (' + digits.slice(2, 5) + ') ' + digits.slice(5, 8) + ' ' + digits.slice(8, 10) + ' ' + digits.slice(10, 12);
    }
    if (digits.startsWith('0') && digits.length >= 11) {
      return '+90 (' + digits.slice(1, 4) + ') ' + digits.slice(4, 7) + ' ' + digits.slice(7, 9) + ' ' + digits.slice(9, 11);
    }
    if (digits.length <= 2 && (digits === '9' || digits === '90')) return '+' + digits;
    if (digits.length <= 3 && digits.startsWith('90')) return '+' + digits;
    if (digits.length >= 3 && digits.startsWith('90')) return '+' + digits.slice(0, 2) + ' (' + digits.slice(2, 5) + ')' + (digits.length > 5 ? ' ' + digits.slice(5, 8) : '') + (digits.length > 8 ? ' ' + digits.slice(8, 10) : '') + (digits.length > 10 ? ' ' + digits.slice(10, 12) : '');
    if (digits.length >= 10 && !digits.startsWith('90')) digits = '90' + digits;
    return digits ? '+' + digits : value;
  }
  document.getElementById('composePhone').addEventListener('blur', function() {
    var v = this.value.trim();
    if (v && /^\+?\d+$/.test(v.replace(/\s/g, ''))) {
      var formatted = formatPhoneInput(v);
      if (formatted) this.value = formatted;
    }
  });

  document.getElementById('composeSend').addEventListener('click', function() {
    const phone = document.getElementById('composePhone').value.trim();
    const message = document.getElementById('composeMessage').value.trim();
    const isAI = document.getElementById('composeIsAI').checked;
    const errEl = document.getElementById('composeError');
    errEl.classList.remove('visible');
    if (!phone) {
      errEl.textContent = 'Telefon numarası gerekli.';
      errEl.classList.add('visible');
      return;
    }
    if (!message) {
      errEl.textContent = 'Mesaj gerekli.';
      errEl.classList.add('visible');
      return;
    }
    post({ action: 'send', userPhone: phone, message: message, isAI: isAI });
    document.getElementById('composeModal').classList.remove('visible');
    document.getElementById('composePhone').value = '';
    document.getElementById('composeMessage').value = '';
  });

  document.getElementById('composeModal').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('visible');
  });

  if (typeof window.chrome !== 'undefined' && window.chrome.webview && window.chrome.webview.postMessage) {
    post({ action: 'webViewReady' });
  }
})();
  </script>
</body>
</html>
